<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14100d" />
      <stop offset="50%" stop-color="#080605" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e3c8" />
      <stop offset="45%" stop-color="#d49a62" />
      <stop offset="100%" stop-color="#9a6334" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c88a53" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded App Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.65" />
  <rect x="34" y="34" width="444" height="444" rx="84" fill="none" stroke="#e6ccb2" stroke-width="1.5" stroke-opacity="0.22" />

  <!-- Top VIP Crown Accent -->
  <path
    d="M196 138 L224 166 L256 122 L288 166 L316 138 L306 184 L206 184 Z"
    fill="url(#goldGrad)"
  />
  <rect x="206" y="190" width="100" height="8" rx="4" fill="url(#goldGrad)" />

  <!-- Crossed Luxury Barber Scissors -->
  <g transform="translate(256, 298)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Blade to Bottom Right Ring -->
    <line x1="-88" y1="-78" x2="54" y2="56" stroke-width="18" />
    <!-- Right Blade to Bottom Left Ring -->
    <line x1="88" y1="-78" x2="-54" y2="56" stroke-width="18" />
    <!-- Center Pivot Screw -->
    <circle cx="0" cy="-10" r="11" fill="#0b0907" stroke="url(#goldGrad)" stroke-width="7" />
    <!-- Left Finger Ring -->
    <circle cx="-74" cy="76" r="30" stroke-width="16" />
    <!-- Right Finger Ring -->
    <circle cx="74" cy="76" r="30" stroke-width="16" />
  </g>

  <!-- Bottom VIP Text Bar -->
  <text
    x="256"
    y="444"
    text-anchor="middle"
    fill="url(#goldGrad)"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="8"
  >
    VIP BERBER
  </text>
</svg>
